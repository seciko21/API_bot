services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-ai
    restart: on-failure
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - bot-network
    # GPU support: Uncomment the following section if you have NVIDIA GPU
    # Requires: NVIDIA GPU + nvidia-docker + NVIDIA Container Toolkit
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      - OLLAMA_MODELS=/root/.ollama/models
      - OLLAMA_KEEP_ALIVE=5m

  telegram-bot:
    build: .
    container_name: telegram-security-bot
    restart: on-failure
    env_file:
      - .env
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:1b}
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - bot-network

networks:
  bot-network:
    driver: bridge

volumes:
  ollama_data:
